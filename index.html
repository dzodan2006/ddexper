      // Suppress Vite HMR WebSocket connection closed warnings/errors in Cloud Run preview
      window.addEventListener('unhandledrejection', function (e) {

          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e?.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        // Auto-recover if a stale browser tab encounters a module hash mismatch from server restarts
        if (msg.includes("reading 'useContext'") || msg.includes('Invalid hook call') || msg.includes('Failed to fetch dynamically imported module')) {
          var now = Date.now();
          var lastReload = parseInt(sessionStorage.getItem('dd_last_stale_reload') || '0', 10);
          if (now - lastReload > 6000) {
            sessionStorage.setItem('dd_last_stale_reload', String(now));
            window.location.reload();
          }
        }
      });
