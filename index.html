<!doctype html>
<html lang="sr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DD DESIGN | Unikatni Komadi, Taft Svila & Luksuzna Moda</title>
    <meta name="description" content="Ekskluzivni Atelje DD Design Danijele Gojković. Unikatne haljine od luksuzne taft svile, kaputi, ženska odela i jedinstvene modne kreacije šivene po meri." />
    <meta name="keywords" content="taft svila, luksuzne taft haljine, DD Design odela, srpska haute couture, visoka moda, kaputi, sako svila, unikatni zenski mantili" />
    <meta name="author" content="DD Design" />
    <link rel="icon" type="image/svg+xml" href="https://images.weserv.nl/?url=64.media.tumblr.com/85a2897f98a2b096033b5b7b2baa4305/941158d434c8785d-07/s1280x1920/1770317d73e6ae1e7a6940ed7119efd4f78c57ce.jpg" />
    <script>
      // Suppress Vite HMR WebSocket connection closed warnings/errors in Cloud Run preview
      window.addEventListener('unhandledrejection', function (e) {
        var msg = e?.reason?.message || String(e?.reason || '');
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect')) {
          e.preventDefault();
          e.stopImmediatePropagation();
        }
      });
      window.addEventListener('error', function (e) {
        var msg = e?.message || '';
        if (msg.includes('WebSocket') || msg.includes('websocket') || msg.includes('failed to connect')) {
          e.preventDefault();
          e.stopImmediatePropagation();
          return;
        }
        // Auto-recover if a stale browser tab encounters a module hash mismatch from server restarts
        if (msg.includes("reading 'useContext'") || msg.includes('Invalid hook call') || msg.includes('Failed to fetch dynamically imported module')) {
          var now = Date.now();
          var lastReload = parseInt(sessionStorage.getItem('dd_last_stale_reload') || '0', 10);
          if (now - lastReload > 6000) {
            sessionStorage.setItem('dd_last_stale_reload', String(now));
            window.location.reload();
          }
        }
      });
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
